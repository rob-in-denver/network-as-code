#cloud-config
# DC-CEDGE1: Viptela vEdge Cloud 20.12 (CML node definition cat-sdwan-vedge, image vedge_20.12.8).
# uuid/otp are placeholders: take the chassis number and token from SD-WAN Manager
# (Configuration > Devices > WAN Edge List) or run
# `request vedge-cloud activate chassis-number <uuid> token <otp>` after boot.
vinitparam:
  - uuid : VEDGE-CLOUD-UUID-DC-CEDGE1
  - otp : REDACTED-FROM-VAULT
  - vbond : 172.31.0.20
  - org : CCIE-LAB
write_files:
  - path: /etc/default/inited
    content: "1\n"
  - path: /etc/confd/init/zcloud.xml
    content: |
      <config xmlns="http://tail-f.com/ns/config/1.0">
        <system xmlns="http://viptela.com/system">
          <personality>vedge</personality>
          <device-model>vedge-cloud</device-model>
          <host-name>DC-CEDGE1</host-name>
          <system-ip>172.31.255.101</system-ip>
          <site-id>200</site-id>
          <organization-name>CCIE-LAB</organization-name>
          <sp-organization-name>CCIE-LAB</sp-organization-name>
          <vbond>
            <remote>172.31.0.20</remote>
            <port>12346</port>
          </vbond>
          <domain-id>1</domain-id>
          <!-- admin credentials injected from Ansible Vault at deploy time -->
        </system>
        <vpn xmlns="http://viptela.com/vpn">
          <vpn-instance>
            <vpn-id>0</vpn-id>
            <ip>
              <route>
                <prefix>0.0.0.0/0</prefix>
                <next-hop>
                  <address>172.31.0.254</address>
                </next-hop>
              </route>
              <route>
                <prefix>172.31.3.0/24</prefix>
                <next-hop>
                  <address>172.31.2.254</address>
                </next-hop>
              </route>
            </ip>
            <interface>
              <if-name>ge0/0</if-name>
              <description>biz-internet to VPN0-SW</description>
              <ip>
                <address>172.31.0.101/24</address>
              </ip>
              <tunnel-interface>
                <encapsulation>
                  <encap>ipsec</encap>
                </encapsulation>
                <color>
                  <value>biz-internet</value>
                </color>
                <allow-service>
                  <all>true</all>
                </allow-service>
              </tunnel-interface>
              <shutdown>false</shutdown>
            </interface>
            <interface>
              <if-name>ge0/1</if-name>
              <description>mpls to MPLS-SW</description>
              <ip>
                <address>172.31.2.101/24</address>
              </ip>
              <tunnel-interface>
                <encapsulation>
                  <encap>ipsec</encap>
                </encapsulation>
                <color>
                  <value>mpls</value>
                  <restrict/>
                </color>
                <allow-service>
                  <all>true</all>
                </allow-service>
              </tunnel-interface>
              <shutdown>false</shutdown>
            </interface>
          </vpn-instance>
          <vpn-instance>
            <vpn-id>512</vpn-id>
            <interface>
              <if-name>eth0</if-name>
              <ip>
                <address>192.168.255.141/24</address>
              </ip>
              <shutdown>false</shutdown>
            </interface>
          </vpn-instance>
          <vpn-instance>
            <vpn-id>10</vpn-id>
            <name>SERVICE</name>
            <ip>
              <route>
                <prefix>10.200.0.0/16</prefix>
                <next-hop>
                  <address>10.200.30.1</address>
                </next-hop>
              </route>
            </ip>
            <interface>
              <if-name>ge0/2</if-name>
              <description>VPN 10 to DC-R4</description>
              <ip>
                <address>10.200.30.2/30</address>
              </ip>
              <shutdown>false</shutdown>
            </interface>
          </vpn-instance>
        </vpn>
      </config>
