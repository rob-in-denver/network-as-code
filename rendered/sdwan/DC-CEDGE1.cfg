#cloud-boothook
system
 host-name DC-CEDGE1
 system-ip 172.31.255.101
 site-id 200
 admin-tech-on-failure
 organization-name "CCIE-LAB"
 vbond 172.31.0.20
!
vrf definition 10
 description DC-SERVICE-VPN
 rd 1:10
 address-family ipv4
  route-target export 1:10
  route-target import 1:10
 exit-address-family
!
interface GigabitEthernet1
 description VPN 0 INET transport
 no shutdown
 ip address 172.31.0.101 255.255.255.0
!
interface GigabitEthernet2
 description VPN 0 MPLS transport
 no shutdown
 ip address 172.31.2.101 255.255.255.0
!
interface GigabitEthernet3
 description VPN 10 DC service side
 vrf forwarding 10
 ip address 10.200.30.2 255.255.255.252
 no shutdown
!
sdwan
 interface GigabitEthernet1
  tunnel-interface
   encapsulation ipsec
   color biz-internet
   allow-service all
  exit
 exit
 interface GigabitEthernet2
  tunnel-interface
   encapsulation ipsec
   color mpls
   allow-service all
  exit
 exit
!
ip route 0.0.0.0 0.0.0.0 172.31.0.254
ip route 172.31.0.0 255.255.0.0 172.31.2.254
ip route vrf 10 10.200.0.0 255.255.0.0 10.200.30.1
!
