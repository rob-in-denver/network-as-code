hostname P1
domain name ccie.lab
domain lookup disable
!
interface Loopback0
 description SP Core RR RID
 ipv4 address 100.64.0.1 255.255.255.255
!
interface GigabitEthernet0/0/0/0
 description to P2 Gi0/0/0/0
 ipv4 address 100.64.10.1 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/0/0/1
 description to PE1 Gi1
 ipv4 address 100.64.10.5 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/0/0/2
 description to PE2 Gi1
 ipv4 address 100.64.10.9 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/0/0/3
 description to PE3 Gi1
 ipv4 address 100.64.10.13 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/0/0/4
 description to PE4 Gi1
 ipv4 address 100.64.10.17 255.255.255.252
 no shutdown
!
router ospf 1
 router-id 100.64.0.1
 area 0
  interface Loopback0
   passive enable
  !
  interface GigabitEthernet0/0/0/0
   network point-to-point
  !
  interface GigabitEthernet0/0/0/1
   network point-to-point
  !
  interface GigabitEthernet0/0/0/2
   network point-to-point
  !
  interface GigabitEthernet0/0/0/3
   network point-to-point
  !
  interface GigabitEthernet0/0/0/4
   network point-to-point
  !
 !
!
mpls ldp
 router-id 100.64.0.1
 interface GigabitEthernet0/0/0/0
 !
 interface GigabitEthernet0/0/0/1
 !
 interface GigabitEthernet0/0/0/2
 !
 interface GigabitEthernet0/0/0/3
 !
 interface GigabitEthernet0/0/0/4
 !
!
router bgp 65500
 bgp router-id 100.64.0.1
 bgp cluster-id 100.64.0.100
 address-family vpnv4 unicast
 !
 neighbor-group RR-CLIENTS
  remote-as 65500
  update-source Loopback0
  address-family vpnv4 unicast
   route-reflector-client
  !
 !
 neighbor 100.64.0.2
  remote-as 65500
  update-source Loopback0
  address-family vpnv4 unicast
  !
 !
 neighbor 100.64.0.11
  use neighbor-group RR-CLIENTS
 !
 neighbor 100.64.0.12
  use neighbor-group RR-CLIENTS
 !
 neighbor 100.64.0.13
  use neighbor-group RR-CLIENTS
 !
 neighbor 100.64.0.14
  use neighbor-group RR-CLIENTS
 !
!
end
