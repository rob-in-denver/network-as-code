hostname DC-R4
no ip domain lookup
ip domain name ccie.lab
!
interface Loopback0
 description DC-R4 RID
 ip address 10.200.255.4 255.255.255.255
 ip ospf 10 area 0
 no shutdown
!
interface Ethernet0/1
 description to DC-SW1 Et1/0
 ip address 10.200.1.25 255.255.255.252
 ip ospf network point-to-point
 ip ospf 10 area 0
 no shutdown
!
interface Ethernet0/2
 description to DC-SW2 Et1/0
 ip address 10.200.1.29 255.255.255.252
 ip ospf network point-to-point
 ip ospf 10 area 0
 no shutdown
!
interface Ethernet0/3
 description to DC-CEDGE1 ge0/2 (VPN 10)
 ip address 10.200.30.1 255.255.255.252
 ip ospf network point-to-point
 ip ospf 10 area 0
 no shutdown
!
interface Ethernet1/0
 description to DC-CEDGE2 ge0/2 (VPN 10)
 ip address 10.200.31.1 255.255.255.252
 ip ospf network point-to-point
 ip ospf 10 area 0
 no shutdown
!
interface Ethernet1/1
 description to ISP Et3/2 (DC internet edge, not in OSPF)
 ip address 172.16.0.246 255.255.255.252
 no shutdown
!
ip route 0.0.0.0 0.0.0.0 172.16.0.245 name ISP-INTERNET
!
router ospf 10
 router-id 10.200.255.4
 passive-interface Loopback0
 auto-cost reference-bandwidth 10000
!
end
