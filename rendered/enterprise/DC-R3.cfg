hostname DC-R3
no ip domain lookup
ip domain name ccie.lab
!
interface Loopback0
 description DC-R3 RID
 ip address 10.200.255.3 255.255.255.255
 ip ospf 10 area 0
 no shutdown
!
interface Ethernet0/1
 description to PE3 Gi4
 ip address 10.200.2.6 255.255.255.252
 no shutdown
!
interface Ethernet0/2
 description to DC-SW1 Et0/2
 ip address 10.200.1.17 255.255.255.252
 ip ospf network point-to-point
 ip ospf 10 area 0
 no shutdown
!
interface Ethernet0/3
 description to DC-SW2 Et0/2
 ip address 10.200.1.21 255.255.255.252
 ip ospf network point-to-point
 ip ospf 10 area 0
 no shutdown
!
interface Ethernet1/0
 description to DC-R2 Et1/0
 ip address 10.200.1.34 255.255.255.252
 ip ospf network point-to-point
 ip ospf 10 area 0
 no shutdown
!
router ospf 10
 router-id 10.200.255.3
 passive-interface Loopback0
 auto-cost reference-bandwidth 10000
 redistribute bgp 65200 subnets
!
router bgp 65200
 bgp router-id 10.200.255.3
 bgp log-neighbor-changes
 no bgp default ipv4-unicast
 neighbor 10.200.2.5 remote-as 65500
 neighbor 10.200.255.2 remote-as 65200
 neighbor 10.200.255.2 update-source Loopback0
 !
 address-family ipv4
  neighbor 10.200.2.5 activate
  neighbor 10.200.255.2 activate
  neighbor 10.200.255.2 next-hop-self
  redistribute ospf 10 match internal external 1 external 2
 exit-address-family
!
end
