hostname DC-R2
no ip domain lookup
ip domain name ccie.lab
!
interface Loopback0
 description DC-R2 RID
 ip address 10.200.255.2 255.255.255.255
 ip ospf 10 area 0
 no shutdown
!
interface Ethernet0/1
 description to PE3 Gi3
 ip address 10.200.2.2 255.255.255.252
 no shutdown
!
interface Ethernet0/2
 description to DC-SW1 Et0/1
 ip address 10.200.1.9 255.255.255.252
 ip ospf network point-to-point
 ip ospf 10 area 0
 no shutdown
!
interface Ethernet0/3
 description to DC-SW2 Et0/1
 ip address 10.200.1.13 255.255.255.252
 ip ospf network point-to-point
 ip ospf 10 area 0
 no shutdown
!
interface Ethernet1/0
 description to DC-R3 Et1/0
 ip address 10.200.1.33 255.255.255.252
 ip ospf network point-to-point
 ip ospf 10 area 0
 no shutdown
!
router ospf 10
 router-id 10.200.255.2
 passive-interface Loopback0
 auto-cost reference-bandwidth 10000
 redistribute bgp 65200 subnets
!
router bgp 65200
 bgp router-id 10.200.255.2
 bgp log-neighbor-changes
 no bgp default ipv4-unicast
 neighbor 10.200.2.1 remote-as 65500
 neighbor 10.200.255.3 remote-as 65200
 neighbor 10.200.255.3 update-source Loopback0
 !
 address-family ipv4
  neighbor 10.200.2.1 activate
  neighbor 10.200.255.3 activate
  neighbor 10.200.255.3 next-hop-self
  redistribute ospf 10 match internal external 1 external 2
 exit-address-family
!
end
