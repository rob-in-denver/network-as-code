hostname DC-SW2
no ip domain lookup
ip domain name ccie.lab
!
vlan 10
 name DC-SERVERS
vlan 20
 name DC-APPS
vlan 99
 name DC-MGMT
!
ip routing
!
interface Loopback0
 description DC-SW2 RID
 ip address 10.200.255.12 255.255.255.255
 ip ospf 10 area 0
 no shutdown
!
interface Ethernet0/1
 no switchport
 description to DC-R2 Et0/3
 ip address 10.200.1.14 255.255.255.252
 ip ospf network point-to-point
 ip ospf 10 area 0
 no shutdown
!
interface Ethernet0/2
 no switchport
 description to DC-R3 Et0/3
 ip address 10.200.1.22 255.255.255.252
 ip ospf network point-to-point
 ip ospf 10 area 0
 no shutdown
!
interface Ethernet0/3
 no switchport
 description to DC-R1 Gi2
 ip address 10.200.1.5 255.255.255.252
 ip ospf network point-to-point
 ip ospf 10 area 0
 no shutdown
!
interface Ethernet1/0
 no switchport
 description to DC-R4 Et0/2
 ip address 10.200.1.30 255.255.255.252
 ip ospf network point-to-point
 ip ospf 10 area 0
 no shutdown
!
interface Vlan10
 description DC-SERVERS SVI
 ip address 10.200.10.3 255.255.255.0
 standby 10 ip 10.200.10.1
 standby 10 priority 90
 standby 10 preempt
 ip ospf 10 area 0
 no shutdown
!
interface Vlan20
 description DC-APPS SVI
 ip address 10.200.20.3 255.255.255.0
 standby 20 ip 10.200.20.1
 standby 20 priority 90
 standby 20 preempt
 ip ospf 10 area 0
 no shutdown
!
interface Vlan99
 description DC-MGMT SVI
 ip address 10.200.99.3 255.255.255.0
 standby 99 ip 10.200.99.1
 standby 99 priority 90
 standby 99 preempt
 ip ospf 10 area 0
 no shutdown
!
router ospf 10
 router-id 10.200.255.12
 passive-interface Loopback0
 passive-interface Vlan10
 passive-interface Vlan20
 passive-interface Vlan99
 auto-cost reference-bandwidth 10000
!
end
