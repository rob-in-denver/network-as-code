hostname DC-R1
no ip domain lookup
ip domain name ccie.lab
!
vrf definition INET
 address-family ipv4
 exit-address-family
!
interface Loopback0
 description DC-R1 RID
 ip address 10.200.255.1 255.255.255.255
 ip ospf 10 area 0
 no shutdown
!
interface GigabitEthernet1
 description to DC-SW1 Et0/3
 ip address 10.200.1.2 255.255.255.252
 ip ospf network point-to-point
 ip ospf 10 area 0
 no shutdown
!
interface GigabitEthernet2
 description to DC-SW2 Et0/3
 ip address 10.200.1.6 255.255.255.252
 ip ospf network point-to-point
 ip ospf 10 area 0
 no shutdown
!
interface GigabitEthernet4
 description to VPN0-SW port6 (FVRF INET)
 vrf forwarding INET
 ip address 172.31.0.200 255.255.255.0
 no shutdown
!
crypto ikev2 proposal IKEV2-DC-PROP
 encryption aes-cbc-256
 integrity sha256
 group 14
!
crypto ikev2 policy IKEV2-DC-POL
 match fvrf INET
 proposal IKEV2-DC-PROP
!
crypto ikev2 keyring KR-DC
 peer ANY
  address 0.0.0.0 0.0.0.0
  pre-shared-key REDACTED-FROM-VAULT
 !
!
crypto ikev2 profile IKE-DC
 match fvrf INET
 match identity remote address 0.0.0.0
 authentication remote pre-share
 authentication local pre-share
 keyring local KR-DC
!
crypto ipsec transform-set TS-DC esp-aes 256 esp-sha256-hmac
 mode transport
!
crypto ipsec profile IPSEC-DC
 set transform-set TS-DC
 set ikev2-profile IKE-DC
!
interface Tunnel10
 description DC DMVPN Phase 3 Hub (branch spokes terminate here)
 ip address 10.19.0.1 255.255.255.0
 no ip redirects
 ip mtu 1400
 ip tcp adjust-mss 1360
 ip nhrp map multicast dynamic
 ip nhrp network-id 110
 ip nhrp authentication REDACTED-FROM-VAULT
 ip nhrp redirect
 tunnel source GigabitEthernet4
 tunnel mode gre multipoint
 tunnel key 110
 tunnel vrf INET
 tunnel protection ipsec profile IPSEC-DC
 no shutdown
!
ip route vrf INET 0.0.0.0 0.0.0.0 172.31.0.254
!
router ospf 10
 router-id 10.200.255.1
 passive-interface Loopback0
 auto-cost reference-bandwidth 10000
 redistribute eigrp 210 subnets
!
router eigrp DC-DMVPN
 address-family ipv4 unicast autonomous-system 210
  router-id 10.200.255.1
  network 10.19.0.0 0.0.0.255
  af-interface Tunnel10
   no split-horizon
   no next-hop-self
  exit-af-interface
  topology base
   redistribute ospf 10 metric 1000000 1 255 1 1500
  exit-af-topology
 exit-address-family
!
end
