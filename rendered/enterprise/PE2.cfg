hostname PE2
no ip domain lookup
ip domain name ccie.lab
!
vrf definition CUST
 rd 65500:100
 address-family ipv4
  route-target export 65500:100
  route-target import 65500:100
 exit-address-family
!
vrf definition SDWAN-MPLS
 rd 65500:201
 address-family ipv4
  route-target export 65500:201
  route-target import 65500:201
  route-target import 65500:200
 exit-address-family
!
mpls ldp router-id Loopback0 force
!
interface Loopback0
 description SP PE RID
 ip address 100.64.0.12 255.255.255.255
 ip ospf 1 area 0
 no shutdown
!
interface GigabitEthernet1
 description to P1 Gi0/0/0/2
 ip address 100.64.10.10 255.255.255.252
 ip ospf network point-to-point
 ip ospf 1 area 0
 mpls ip
 no shutdown
!
interface GigabitEthernet2
 description to P2 Gi0/0/0/2
 ip address 100.64.10.26 255.255.255.252
 ip ospf network point-to-point
 ip ospf 1 area 0
 mpls ip
 no shutdown
!
interface GigabitEthernet6
 description to S2-EDGE ge0/1 (mpls)
 vrf forwarding SDWAN-MPLS
 ip address 172.31.3.5 255.255.255.252
 no shutdown
!
router ospf 1
 router-id 100.64.0.12
 passive-interface Loopback0
 auto-cost reference-bandwidth 10000
!
router bgp 65500
 bgp router-id 100.64.0.12
 bgp log-neighbor-changes
 no bgp default ipv4-unicast
 neighbor 100.64.0.1 remote-as 65500
 neighbor 100.64.0.1 update-source Loopback0
 neighbor 100.64.0.2 remote-as 65500
 neighbor 100.64.0.2 update-source Loopback0
 !
 address-family vpnv4
  neighbor 100.64.0.1 activate
  neighbor 100.64.0.1 send-community extended
  neighbor 100.64.0.2 activate
  neighbor 100.64.0.2 send-community extended
 exit-address-family
 !
 address-family ipv4 vrf SDWAN-MPLS
  redistribute connected
 exit-address-family
!
end
