hostname ISP
no ip domain lookup
ip domain name ccie.lab
!
! single internet node (connected routes only, no routing protocol)
! Every internet-facing interface in the enterprise is one hop from this node.
interface Ethernet3/1
 description to DC-R1 Gi3 (DC DMVPN hub)
 ip address 172.16.0.249 255.255.255.252
 no shutdown
!
interface Ethernet3/2
 description to DC-R4 Et1/1 (DC internet edge)
 ip address 172.16.0.245 255.255.255.252
 no shutdown
!
interface Ethernet3/3
 description to VPN0-SW port6 (SD-WAN biz-internet / controllers)
 ip address 172.31.0.254 255.255.255.0
 no shutdown
!
interface Ethernet2/0
 description to S1-EDGE ge0/0 (biz-internet)
 ip address 172.16.11.2 255.255.255.252
 no shutdown
!
interface Ethernet2/1
 description to S2-EDGE ge0/0 (biz-internet)
 ip address 172.16.12.2 255.255.255.252
 no shutdown
!
interface Ethernet2/2
 description to S3-EDGE ge0/0 (biz-internet)
 ip address 172.16.13.2 255.255.255.252
 no shutdown
!
end
