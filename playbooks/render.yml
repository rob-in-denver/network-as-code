---
- name: Render device configuration from the YAML source of truth
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Load the VXLAN fabric
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../data/fabric.yml"
        name: fabric

    - name: Load the DMVPN overlay
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../data/dmvpn.yml"
        name: dmvpn

    - name: Load the enterprise SP, DC, and SD-WAN core
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../data/enterprise_core.yml"
        name: enterprise

    - name: Create render directories
      ansible.builtin.file:
        path: "{{ playbook_dir }}/../rendered/{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - nxos
        - iosxe
        - iosxr
        - enterprise
        - sdwan

    - name: Render NX-OS fabric devices
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/nxos/device.j2"
        dest: "{{ playbook_dir }}/../rendered/nxos/{{ item.hostname }}.cfg"
        mode: "0644"
      loop: "{{ fabric.devices }}"
      vars:
        device: "{{ item }}"

    - name: Render IOS-XE DMVPN routers
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/iosxe/dmvpn.j2"
        dest: "{{ playbook_dir }}/../rendered/iosxe/{{ item.hostname }}.cfg"
        mode: "0644"
      loop: "{{ dmvpn.hubs + dmvpn.spokes }}"
      vars:
        device: "{{ item }}"

    - name: Render IOS XR SP core P/RR routers
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/iosxr/sp_p.j2"
        dest: "{{ playbook_dir }}/../rendered/iosxr/{{ item.hostname }}.cfg"
        mode: "0644"
      loop: "{{ enterprise.sp_p_routers }}"
      vars:
        device: "{{ item }}"

    - name: Render Cat8000v SP PE routers
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/iosxe/sp_pe.j2"
        dest: "{{ playbook_dir }}/../rendered/enterprise/{{ item.hostname }}.cfg"
        mode: "0644"
      loop: "{{ enterprise.sp_pe_routers }}"
      vars:
        device: "{{ item }}"

    - name: Render Data Center routers
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/iosxe/dc_router.j2"
        dest: "{{ playbook_dir }}/../rendered/enterprise/{{ item.hostname }}.cfg"
        mode: "0644"
      loop: "{{ enterprise.dc_routers }}"
      vars:
        device: "{{ item }}"

    - name: Render Data Center switches
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/iosxe/dc_switch.j2"
        dest: "{{ playbook_dir }}/../rendered/enterprise/{{ item.hostname }}.cfg"
        mode: "0644"
      loop: "{{ enterprise.dc_switches }}"
      vars:
        device: "{{ item }}"

    - name: Render the single ISP node
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/iosxe/isp.j2"
        dest: "{{ playbook_dir }}/../rendered/enterprise/{{ enterprise.isp.hostname }}.cfg"
        mode: "0644"
      vars:
        device: "{{ enterprise.isp }}"

    - name: Render SD-WAN vEdge 20.12 cloud-init configs (DC and site edges)
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/sdwan/vedge.j2"
        dest: "{{ playbook_dir }}/../rendered/sdwan/{{ item.hostname }}.cfg"
        mode: "0644"
      loop: "{{ enterprise.sdwan_edges }}"
      vars:
        device: "{{ item }}"

    - name: Render SD-WAN controller cloud-init configs
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/sdwan/controller.j2"
        dest: "{{ playbook_dir }}/../rendered/sdwan/{{ item.hostname }}.yaml"
        mode: "0644"
      loop: "{{ enterprise.sdwan_controllers }}"
      vars:
        device: "{{ item }}"

    - name: Collapse extra blank lines in rendered configs
      ansible.builtin.command: python3 scripts/tidy_rendered.py
      args:
        chdir: "{{ playbook_dir }}/.."
      changed_when: false
