---
# Source of truth for a two-site VXLAN BGP EVPN fabric.
# Render with: ansible-playbook playbooks/render.yml
name: mesa-multisite
anycast_gateway_mac: "0000.2222.3333"
ospf_process: UNDERLAY
ospf_area: "0.0.0.0"
mtu: 9216
sites:
  - id: a
    name: site-a
    asn: 65011
    multisite_id: 65011
    multisite_vip: "10.100.1.1"
  - id: b
    name: site-b
    asn: 65012
    multisite_id: 65012
    multisite_vip: "10.100.2.1"
vrfs:
  - name: APP
    vni: 50001
    vlan: 901
vnis:
  - id: 10010
    vlan: 10
    name: APP-WEB
    type: l2
    vrf: APP
    gateway: "10.10.10.1"
    prefix: 24
  - id: 10020
    vlan: 20
    name: APP-DB
    type: l2
    vrf: APP
    gateway: "10.20.20.1"
    prefix: 24
  - id: 50001
    vlan: 901
    name: APP-L3
    type: l3
    vrf: APP
devices:
  - hostname: spine-a1
    role: spine
    site: a
    router_id: "10.0.0.11"
    interfaces:
      - name: "Ethernet1/1"
        description: leaf-a1
        address: "10.1.11.0"
        prefix: 31
        role: underlay
        peer: leaf-a1
        peer_interface: "Ethernet1/1"
        peer_address: "10.1.11.1"
      - name: "Ethernet1/2"
        description: leaf-a2
        address: "10.1.11.2"
        prefix: 31
        role: underlay
        peer: leaf-a2
        peer_interface: "Ethernet1/1"
        peer_address: "10.1.11.3"
