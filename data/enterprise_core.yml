isp:
  hostname: ISP
  node_definition: iol-xe
  ram_mb: 1024
  role: single internet node (connected routes only, no routing protocol)
  interfaces:
    - name: Ethernet3/1
      description: to DC-R1 Gi3 (DC DMVPN hub)
      address: 172.16.0.249
      mask: 255.255.255.252
    - name: Ethernet3/2
      description: to DC-R4 Et1/1 (DC internet edge)
      address: 172.16.0.245
      mask: 255.255.255.252
    - name: Ethernet3/3
      description: to VPN0-SW port6 (SD-WAN biz-internet / controllers)
      address: 172.31.0.254
      mask: 255.255.255.0
    - name: Ethernet2/0
      description: to S1-EDGE ge0/0 (biz-internet)
      address: 172.16.11.2
      mask: 255.255.255.252
