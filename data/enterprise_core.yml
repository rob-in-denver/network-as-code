        rd: "65500:201"
        rt: "65500:201"
        rt_import_extra:
          - "65500:200"
    vrf_interfaces:
      - name: GigabitEthernet3
        vrf: SDWAN-MPLS
        description: to MPLS-SW port0
        address: 172.31.2.254
        mask: 255.255.255.0
